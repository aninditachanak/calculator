<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scientific Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <!-- Calculator Header -->
        <div class="header">
            <h1>Scientific Calculator</h1>
            <span>DEG</span>
        </div>


        <!-- Display -->
        <div class="display-box">

            <div id="previous"></div>

            <input
                type="text"
                id="display"
                value="0"
                readonly
            >

        </div>


        <!-- Calculator Buttons -->
        <div class="buttons">

            <!-- Row 1 -->
            <button class="function" onclick="clearDisplay()">
                AC
            </button>

            <button class="function" onclick="deleteLast()">
                DEL
            </button>

            <button class="function" onclick="appendValue('(')">
                (
            </button>

            <button class="function" onclick="appendValue(')')">
                )
            </button>


            <!-- Row 2 -->
            <button class="function" onclick="appendValue('[')">
                [
            </button>

            <button class="function" onclick="appendValue(']')">
                ]
            </button>

            <button class="function" onclick="appendValue('{')">
                {
            </button>

            <button class="function" onclick="appendValue('}')">
                }
            </button>


            <!-- Row 3 -->
            <button class="scientific" onclick="appendFunction('sin')">
                sin
            </button>

            <button class="scientific" onclick="appendFunction('cos')">
                cos
            </button>

            <button class="scientific" onclick="appendFunction('tan')">
                tan
            </button>

            <button class="operator" onclick="appendValue('/')">
                ÷
            </button>


            <!-- Row 4 -->
            <button class="scientific" onclick="appendFunction('sqrt')">
                √
            </button>

            <button class="scientific" onclick="square()">
                x²
            </button>

            <button class="scientific" onclick="appendValue('^')">
                xʸ
            </button>

            <button class="operator" onclick="appendValue('*')">
                ×
            </button>


            <!-- Row 5 -->
            <button onclick="appendValue('7')">
                7
            </button>

            <button onclick="appendValue('8')">
                8
            </button>

            <button onclick="appendValue('9')">
                9
            </button>

            <button class="operator" onclick="appendValue('-')">
                −
            </button>


            <!-- Row 6 -->
            <button onclick="appendValue('4')">
                4
            </button>

            <button onclick="appendValue('5')">
                5
            </button>

            <button onclick="appendValue('6')">
                6
            </button>

            <button class="operator" onclick="appendValue('+')">
                +
            </button>


            <!-- Row 7 -->
            <button onclick="appendValue('1')">
                1
            </button>

            <button onclick="appendValue('2')">
                2
            </button>

            <button onclick="appendValue('3')">
                3
            </button>

            <button class="operator" onclick="appendValue('%')">
                %
            </button>


            <!-- Row 8 -->
            <button class="special" onclick="appendValue('#')">
                #
            </button>

            <button class="special" onclick="appendValue('$')">
                $
            </button>

            <button class="special" onclick="appendValue('@')">
                @
            </button>

            <button class="scientific" onclick="appendValue('π')">
                π
            </button>


            <!-- Row 9 -->
            <button class="zero" onclick="appendValue('0')">
                0
            </button>

            <button onclick="appendValue('.')">
                .
            </button>

            <button class="equal" onclick="calculate()">
                =
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
</html>
